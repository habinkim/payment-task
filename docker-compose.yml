services:
  mysql:
    image: mysql:8.0
    container_name: switchwon-mysql
    # 채점자 PC의 기존 MySQL(3306)과 충돌하지 않도록 호스트 포트를 옮긴다.
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: switchwon
      MYSQL_USER: switchwon
      MYSQL_PASSWORD: switchwon
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uswitchwon", "-pswitchwon" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    container_name: switchwon-payment
    ports:
      - "18080:18080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/switchwon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      mysql:
        condition: service_healthy
