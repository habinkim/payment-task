spring:
  application:
    name: switchwon-payment

  profiles:
    default: dev

  datasource:
    url: jdbc:h2:mem:switchwon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 18080

payment:
  gateway:
    mode: mock
    chaos:
      enabled: false
      timeout-rate: 0.0
      failure-rate: 0.0
  reconcile:
    enabled: false
    fixed-delay: 60s
    batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  page-title: 스위치원 결제 API
  dark-mode: true
  telemetry: false
