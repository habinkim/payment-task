spring:
  application:
    name: switchwon-payment

  datasource:
    # 별도 DB가 제공되지 않으므로 In-Memory H2를 쓴다(과제 명세 Tech Stack).
    # DB_CLOSE_DELAY=-1 로 마지막 커넥션이 닫혀도 스키마가 유지된다.
    url: jdbc:h2:mem:switchwon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 18080

payment:
  gateway:
    base-url: http://localhost:18080/not-used
    connect-timeout: 1s
    read-timeout: 3s
  reconcile:
    fixed-delay: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
    com.switchwon.payment: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    com.switchwon.payment: INFO
